[package]
name = "babel"
version = "2.1.0-native"
edition = "2024"
description = "Constraint-expression language for optimizer formulations"
license = "MIT"

[dependencies]
antlr-rust-runtime = "0.34"
anyhow = "1.0"
faer = { version = "0.24.4", default-features = false, features = ["std"] }
futures-channel = "0.3.34"
# Explicit SIMD for the evaluator's tile kernels, with the instruction set
# chosen at run time. The features mirror faer's exactly so that there is one
# pulp in the build; `x86-v4` (AVX-512) is deliberately off, because feature
# unification would switch faer to it too — a later, measured experiment.
pulp = { version = "0.22.3", default-features = false, features = ["std", "x86-v3"] }
rand = "0.10"
# Diagnosis, not logging. The pool silently falls back to sampling whenever the
# solver cannot be given a constraint, and without this there is no way for a
# caller to learn that happened or why. Compiles to nothing without a subscriber.
tracing = "0.1"
z3 = { version = "0.21.0", features = ["bundled"] }

[build-dependencies]
antlr-rust-codegen = "0.34"

[dev-dependencies]
pollster = { version = "1.0.1", features = ["macro"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
